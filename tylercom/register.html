<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYLERCOM | Register</title>
<script>
var storedTheme = localStorage.getItem("theme");
document.documentElement.setAttribute("data-theme", storedTheme === "dark" ? "dark" : "light");
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="cart-header">
    <button onclick="window.location.href='index.html'" aria-label="Back to shop">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1>Create account</h1>
    <span></span>
</header>

<div class="auth-container">
    <form id="register-form" class="auth-form">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" required>

        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required>

        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required minlength="4">

        <p id="register-error" class="auth-error"></p>
        <p id="register-success" class="auth-success"></p>

        <button type="submit">Register</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script type="module" src="js/register.js"></script>
</body>
</html>
