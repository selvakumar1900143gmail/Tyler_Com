<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYLERCOM | Admin</title>
<script>
var storedTheme = localStorage.getItem("theme");
document.documentElement.setAttribute("data-theme", storedTheme === "dark" ? "dark" : "light");
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="cart-header">
    <button onclick="window.location.href='index.html'" aria-label="Back to shop">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1>Admin panel</h1>
    <button id="admin-logout" aria-label="Log out"><i class="fa-solid fa-right-from-bracket"></i></button>
</header>

<div class="auth-container">
    <form id="product-form" class="auth-form">
        <label for="p-title">Title</label>
        <input type="text" id="p-title" required>

        <label for="p-price">Price</label>
        <input type="number" id="p-price" min="0" step="0.01" required>

        <label for="p-category">Category</label>
        <input type="text" id="p-category" placeholder="e.g. laptops">

        <label for="p-thumbnail">Image URL</label>
        <input type="url" id="p-thumbnail" placeholder="https://...">

        <label for="p-description">Description</label>
        <input type="text" id="p-description">

        <button type="submit">Add product</button>
    </form>

    <h2 class="admin-list-title">Products you've added</h2>
    <div id="admin-product-list"></div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
